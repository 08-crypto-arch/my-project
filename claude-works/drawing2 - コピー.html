<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇宙お絵描き</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      width: 100dvw;
      height: 100dvh;
      font-family: 'Segoe UI', sans-serif;
    }

    #canvas { display: block; cursor: crosshair; }

    #toolbar {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(10, 5, 30, 0.75);
      border: 1px solid rgba(150, 100, 255, 0.3);
      border-radius: 40px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 24px rgba(100, 60, 200, 0.3);
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .swatch:hover  { transform: scale(1.2); }
    .swatch.active { border-color: #fff; transform: scale(1.2); }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(150, 100, 255, 0.3);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(200, 180, 255, 0.8);
      font-size: 11px;
    }
    input[type="range"] { width: 70px; accent-color: #a070ff; }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: rgba(100, 60, 200, 0.3);
      color: rgba(200, 180, 255, 0.9);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: rgba(130, 80, 255, 0.5); }

    /* ズームレベル表示 */
    #zoom-label {
      font-size: 11px;
      color: rgba(200, 180, 255, 0.7);
      min-width: 36px;
      text-align: center;
    }

    #hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(180, 150, 255, 0.6);
      font-size: 13px;
      letter-spacing: 0.05em;
      pointer-events: none;
      transition: opacity 1.5s;
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="hint">宇宙に何かを描いてみて…</div>

<div id="toolbar">
  <div class="swatch active" data-color="#ffffff" style="background:#ffffff;" title="白"></div>
  <div class="swatch" data-color="#00e5ff" style="background:#00e5ff;" title="シアン"></div>
  <div class="swatch" data-color="#b06dff" style="background:#b06dff;" title="パープル"></div>
  <div class="swatch" data-color="#ff6eb4" style="background:#ff6eb4;" title="ピンク"></div>
  <div class="swatch" data-color="#ffd966" style="background:#ffd966;" title="ゴールド"></div>
  <div class="swatch" data-color="#66ffb2" style="background:#66ffb2;" title="グリーン"></div>

  <div class="divider"></div>

  <div class="slider-wrap">
    <span>✦</span>
    <input type="range" id="size-slider" min="1" max="20" value="3">
  </div>

  <div class="divider"></div>

  <!-- ズームボタン -->
  <button class="icon-btn" id="btn-zoom-out" title="縮小 (-)">－</button>
  <span id="zoom-label">100%</span>
  <button class="icon-btn" id="btn-zoom-in"  title="拡大 (+)">＋</button>

  <div class="divider"></div>

  <button class="icon-btn" id="btn-clear" title="全消去">🗑</button>
  <button class="icon-btn" id="btn-save" title="保存">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
      <path d="M10 13L10 4M10 13L7 10M10 13L13 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 14v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const hint   = document.getElementById('hint');

  const BG_STAR_COUNT  = 200;
  const MIN_SPEED      = 0.2;
  const MAX_SPEED      = 0.7;
  const MAX_ROTATION   = 0.003;
  const FADE_IN_STEP   = 0.02;
  const GLOW_BLUR_BASE = 6;
  const ZOOM_MIN       = 0.25;
  const ZOOM_MAX       = 4;
  const ZOOM_STEP      = 0.15;
  const BOUNCE_COLORS  = ['#ffffff', '#00e5ff', '#ff6eb4', '#ffd966', '#66ffb2', '#c0f0ff'];

  // ズーム状態
  let zoom     = 1;
  let zoomOriX = 0; // ズームの中心（画面座標）
  let zoomOriY = 0;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== 状態 =====
  let penColor      = '#ffffff';
  let penSize       = 3;
  let drawing       = false;
  let currentPoints = [];

  const floatingStrokes = [];
  const bgStars         = [];

  // ===== ズームユーティリティ =====
  // 画面座標 → ワールド座標
  function screenToWorld(sx, sy) {
    return {
      x: (sx - canvas.width  / 2) / zoom + canvas.width  / 2,
      y: (sy - canvas.height / 2) / zoom + canvas.height / 2,
    };
  }

  function applyZoom(delta, originX, originY) {
    const before = screenToWorld(originX, originY);
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom * (1 + delta)));
    // ズーム後に同じワールド点が originX,originY に来るようオフセット調整は
    // translate で吸収するためここでは zoom だけ更新
    updateZoomLabel();
  }

  function updateZoomLabel() {
    document.getElementById('zoom-label').textContent =
      Math.round(zoom * 100) + '%';
  }

  // ===== 背景星 =====
  function initBgStars() {
    bgStars.length = 0;
    for (let i = 0; i < BG_STAR_COUNT; i++) {
      bgStars.push({
        x:      Math.random() * canvas.width,
        y:      Math.random() * canvas.height,
        r:      Math.random() * 1.2 + 0.2,
        alpha:  Math.random(),
        dAlpha: (Math.random() * 0.008 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
        dx:     (Math.random() - 0.5) * 0.08,
        dy:     (Math.random() - 0.5) * 0.08,
      });
    }
  }
  initBgStars();

  // ストロークを指定色でオフスクリーンに描画して返す
  function renderStrokeImage(points, color, size, ox, oy, w, h) {
    const off    = document.createElement('canvas');
    off.width    = w;
    off.height   = h;
    const offCtx = off.getContext('2d');
    offCtx.lineCap     = 'round';
    offCtx.lineJoin    = 'round';
    offCtx.lineWidth   = size;
    offCtx.strokeStyle = color;
    offCtx.shadowColor = color;
    offCtx.shadowBlur  = size * 3 + GLOW_BLUR_BASE;
    offCtx.beginPath();
    offCtx.moveTo(points[0].x - ox, points[0].y - oy);
    for (let i = 1; i < points.length; i++) {
      offCtx.lineTo(points[i].x - ox, points[i].y - oy);
    }
    offCtx.stroke();
    offCtx.shadowBlur  = size * 7 + 14;
    offCtx.globalAlpha = 0.35;
    offCtx.stroke();
    return off;
  }

  // 現在色を除いたランダムな色を返す
  function pickBounceColor(currentColor) {
    const others = BOUNCE_COLORS.filter(c => c !== currentColor);
    return others[Math.floor(Math.random() * others.length)];
  }

  // ===== ストロークをキャプチャ =====
  function captureStroke(points, color, size) {
    if (points.length < 2) return;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of points) {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    }

    const pad = size * 4 + 20;
    const ox  = minX - pad;
    const oy  = minY - pad;
    const w   = Math.max(maxX - minX + pad * 2, 1);
    const h   = Math.max(maxY - minY + pad * 2, 1);

    const speed = MIN_SPEED + Math.random() * (MAX_SPEED - MIN_SPEED);
    const angle = Math.random() * Math.PI * 2;

    floatingStrokes.push({
      img:    renderStrokeImage(points, color, size, ox, oy, w, h),
      // 元データ（跳ね返り時の再描画用）
      points, size, color,
      ox, oy,
      cx:    ox + w / 2,
      cy:    oy + h / 2,
      dx:    Math.cos(angle) * speed,
      dy:    Math.sin(angle) * speed,
      rot:   0,
      dRot:  (Math.random() - 0.5) * MAX_ROTATION * 2,
      alpha: 0,
      w,
      h,
    });
  }

  // ===== アニメーション =====
  function animate() {
    requestAnimationFrame(animate);

    const W = canvas.width;
    const H = canvas.height;

    // 背景（ズーム変換の外で描く）
    const grad = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.5, W * 0.8);
    grad.addColorStop(0,   '#0a0520');
    grad.addColorStop(0.5, '#060318');
    grad.addColorStop(1,   '#000008');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // ズーム変換を適用
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2, -H / 2);

    // 背景星
    for (const s of bgStars) {
      s.alpha += s.dAlpha;
      if (s.alpha > 1) { s.alpha = 1; s.dAlpha *= -1; }
      if (s.alpha < 0) { s.alpha = 0; s.dAlpha *= -1; }
      s.x = (s.x + s.dx + W) % W;
      s.y = (s.y + s.dy + H) % H;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,180,255,${s.alpha * 0.8})`;
      ctx.fill();
    }

    // 漂うストローク（跳ね返り）
    for (const s of floatingStrokes) {
      if (s.alpha < 1) s.alpha = Math.min(1, s.alpha + FADE_IN_STEP);

      s.cx  += s.dx;
      s.cy  += s.dy;
      s.rot += s.dRot;

      // 画面端で跳ね返る＆色を変える
      const hw = s.w / 2;
      const hh = s.h / 2;
      let bounced = false;
      if (s.cx - hw < 0)  { s.cx = hw;      s.dx =  Math.abs(s.dx); bounced = true; }
      if (s.cx + hw > W)  { s.cx = W - hw;  s.dx = -Math.abs(s.dx); bounced = true; }
      if (s.cy - hh < 0)  { s.cy = hh;      s.dy =  Math.abs(s.dy); bounced = true; }
      if (s.cy + hh > H)  { s.cy = H - hh;  s.dy = -Math.abs(s.dy); bounced = true; }
      if (bounced) {
        s.color = pickBounceColor(s.color);
        s.img   = renderStrokeImage(s.points, s.color, s.size, s.ox, s.oy, s.w, s.h);
      }

      ctx.save();
      ctx.globalAlpha = s.alpha;
      ctx.translate(s.cx, s.cy);
      ctx.rotate(s.rot);
      ctx.drawImage(s.img, -s.w / 2, -s.h / 2);
      ctx.restore();
    }

    // 描画プレビュー
    if (drawing && currentPoints.length >= 2) {
      ctx.save();
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      ctx.lineWidth   = penSize;
      ctx.strokeStyle = penColor;
      ctx.shadowColor = penColor;
      ctx.shadowBlur  = penSize * 3 + GLOW_BLUR_BASE;
      ctx.beginPath();
      ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
      for (let i = 1; i < currentPoints.length; i++) {
        ctx.lineTo(currentPoints[i].x, currentPoints[i].y);
      }
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore(); // ズーム変換を戻す
  }

  animate();

  // ===== 描画イベント =====
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const src  = e.touches ? e.touches[0] : e;
    // 画面座標 → ワールド座標に変換
    return screenToWorld(src.clientX - rect.left, src.clientY - rect.top);
  }

  function onStart(e) {
    e.preventDefault();
    drawing = true;
    currentPoints = [getPos(e)];
    hint.style.opacity = '0';
  }

  function onMove(e) {
    e.preventDefault();
    if (!drawing) return;
    currentPoints.push(getPos(e));
  }

  function onEnd(e) {
    if (!drawing) return;
    drawing = false;
    if (currentPoints.length >= 2) {
      captureStroke(currentPoints, penColor, penSize);
    }
    currentPoints = [];
  }

  canvas.addEventListener('mousedown',  onStart, { passive: false });
  canvas.addEventListener('mousemove',  onMove,  { passive: false });
  canvas.addEventListener('mouseup',    onEnd);
  canvas.addEventListener('mouseleave', onEnd);
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove',  onMove,  { passive: false });
  canvas.addEventListener('touchend',   onEnd,   { passive: false });

  // ===== ホイールズーム =====
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    applyZoom(delta, e.clientX, e.clientY);
  }, { passive: false });

  // ===== ピンチズーム =====
  let lastPinchDist = null;

  canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 2) lastPinchDist = null;
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    const dx   = e.touches[0].clientX - e.touches[1].clientX;
    const dy   = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    if (lastPinchDist !== null) {
      const delta = (dist - lastPinchDist) / 200;
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      applyZoom(delta, mx, my);
    }
    lastPinchDist = dist;
  }, { passive: true });

  canvas.addEventListener('touchend', () => { lastPinchDist = null; }, { passive: true });

  // ===== ズームボタン =====
  document.getElementById('btn-zoom-in').addEventListener('click', () => {
    applyZoom(ZOOM_STEP * 2, canvas.width / 2, canvas.height / 2);
  });
  document.getElementById('btn-zoom-out').addEventListener('click', () => {
    applyZoom(-ZOOM_STEP * 2, canvas.width / 2, canvas.height / 2);
  });

  // キーボードショートカット
  document.addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') applyZoom( ZOOM_STEP * 2, canvas.width / 2, canvas.height / 2);
    if (e.key === '-')                  applyZoom(-ZOOM_STEP * 2, canvas.width / 2, canvas.height / 2);
    if (e.key === '0')                  { zoom = 1; updateZoomLabel(); }
  });

  // ===== ツールバー =====
  document.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      penColor = sw.dataset.color;
    });
  });

  document.getElementById('size-slider').addEventListener('input', e => {
    penSize = parseInt(e.target.value, 10);
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (floatingStrokes.length === 0) return;
    if (!confirm('宇宙を空にしますか？')) return;
    floatingStrokes.length = 0;
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = `universe-${Date.now()}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
</script>
</body>
</html>
