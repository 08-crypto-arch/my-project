# スライドデザイン設定ファイル
# このファイルを編集して、スライド生成のプロンプトをカスタマイズできます

# =============================================================================
# メタ情報
# =============================================================================
meta:
  name: "デフォルト設定"
  description: "プログラミング教育用のシンプルでクリーンなスライドデザイン"
  version: "1.0"
  author: "Movie Studio"

# =============================================================================
# グローバル設定（すべてのスライドに適用）
# =============================================================================
global:
  # 基本スタイル
  style:
    primary_color: "#2563EB"      # メインカラー（青）
    secondary_color: "#7C3AED"    # セカンダリカラー（紫）
    accent_color: "#10B981"       # アクセントカラー（緑）
    background_color: "#FFFFFF"   # 背景色
    text_color: "#1F2937"         # テキスト色

  # タイポグラフィ
  typography:
    heading_font: "ゴシック体（サンセリフ）"
    body_font: "ゴシック体（サンセリフ）"
    code_font: "等幅フォント（モノスペース）"

  # 共通の制約・条件
  constraints:
    - "日本語テキストは一字一句正確に出力すること"
    - "日本語フォントはゴシック体（サンセリフ）を使用"
    - "色使いは落ち着いたトーンで統一"
    - "初心者にも分かりやすいシンプルなデザイン"
    - "余白を適切に取り、詰め込みすぎない"
    - "視覚的な階層構造を明確にする"
    - "アイコンやイラストは必要最小限に"

# =============================================================================
# レイアウトテンプレート定義
# =============================================================================
templates:
  # ---------------------------------------------------------------------------
  # タイトルスライド
  # ---------------------------------------------------------------------------
  title:
    name: "タイトルスライド"
    description: "セクションや動画の冒頭で使用する大きなタイトル表示"
    keywords:
      - "タイトル"
      - "導入"
      - "オープニング"
      - "セクション開始"
      - "章"
    prompt_template: |
      【レイアウト】タイトルスライド

      - 画面中央に大きくタイトルを配置
      - サブタイトルがあれば、タイトルの下に小さめに配置
      - 背景はシンプルなグラデーションまたは単色
      - 必要に応じてシンプルなアイコンを添える

      【デザイン方針】
      - インパクトがありながらも落ち着いた印象
      - タイトルの文字は大きく読みやすく
      - 余計な装飾は省く

  # ---------------------------------------------------------------------------
  # コンテンツスライド
  # ---------------------------------------------------------------------------
  content:
    name: "コンテンツスライド"
    description: "テキストによる説明を中心としたスライド"
    keywords:
      - "説明"
      - "ポイント"
      - "まとめ"
      - "箇条書き"
      - "要点"
      - "特徴"
      - "メリット"
    prompt_template: |
      【レイアウト】コンテンツスライド

      - 上部にセクションタイトルを配置
      - メインエリアにテキストコンテンツを配置
      - 箇条書きの場合は視覚的な階層を明確に
      - 重要なキーワードは強調表示

      【デザイン方針】
      - 読みやすさを最優先
      - 1スライドに情報を詰め込みすぎない
      - 行間・文字間を適切に確保

  # ---------------------------------------------------------------------------
  # 図解スライド
  # ---------------------------------------------------------------------------
  diagram:
    name: "図解スライド"
    description: "概念や関係性を視覚的に説明する図解中心のスライド"
    keywords:
      - "図解"
      - "フロー"
      - "構造"
      - "関係"
      - "仕組み"
      - "アーキテクチャ"
      - "流れ"
      - "プロセス"
      - "MVC"
      - "データ"
      - "サーバー"
      - "クライアント"
    prompt_template: |
      【レイアウト】図解スライド

      - 中央に大きく図解を配置
      - 必要に応じて簡潔な説明文を添える
      - 矢印や線で関係性を明示
      - 各要素にラベルを付ける

      【デザイン方針】
      - シンプルな図形（四角、丸、矢印）を使用
      - 色で要素の種類を区別
      - フローの方向は左→右または上→下で統一
      - 一目で全体像が把握できるように

  # ---------------------------------------------------------------------------
  # コードスライド
  # ---------------------------------------------------------------------------
  code:
    name: "コードスライド"
    description: "ソースコードの表示や解説を行うスライド"
    keywords:
      - "コード"
      - "ソースコード"
      - "サンプル"
      - "実装"
      - "プログラム"
      - "スクリプト"
      - "コマンド"
      - "ターミナル"
    prompt_template: |
      【レイアウト】コードスライド

      - コードブロックを見やすく配置
      - 背景はダークテーマまたはライトグレー
      - シンタックスハイライトを適用
      - 重要な行にはマーカーや矢印で注目を促す

      【デザイン方針】
      - 等幅フォントを使用
      - 適切なフォントサイズで読みやすく
      - 行番号があると分かりやすい
      - コメントで補足説明を入れる

  # ---------------------------------------------------------------------------
  # 比較スライド
  # ---------------------------------------------------------------------------
  comparison:
    name: "比較スライド"
    description: "2つ以上の概念や選択肢を比較するスライド"
    keywords:
      - "比較"
      - "違い"
      - "vs"
      - "対比"
      - "メリット・デメリット"
      - "どっち"
    prompt_template: |
      【レイアウト】比較スライド

      - 画面を2分割または3分割
      - 各項目を並列に配置
      - 共通点・相違点が分かりやすいように
      - 表形式も効果的

      【デザイン方針】
      - 色で項目を区別
      - 構造を揃えて比較しやすく
      - アイコンで視認性を高める

  # ---------------------------------------------------------------------------
  # ステップスライド
  # ---------------------------------------------------------------------------
  steps:
    name: "ステップスライド"
    description: "手順や段階を順番に説明するスライド"
    keywords:
      - "手順"
      - "ステップ"
      - "流れ"
      - "方法"
      - "やり方"
      - "順番"
      - "工程"
    prompt_template: |
      【レイアウト】ステップスライド

      - 番号付きで手順を表示
      - 横並びまたは縦並びで段階を示す
      - 現在のステップを強調（該当する場合）
      - 矢印で流れを明示

      【デザイン方針】
      - 番号は大きく目立つように
      - ステップ間の関係を視覚化
      - 進捗が分かるデザイン

  # ---------------------------------------------------------------------------
  # まとめスライド
  # ---------------------------------------------------------------------------
  summary:
    name: "まとめスライド"
    description: "学習内容の総括やポイント整理を行うスライド"
    keywords:
      - "まとめ"
      - "振り返り"
      - "ポイント"
      - "おさらい"
      - "復習"
      - "学んだこと"
    prompt_template: |
      【レイアウト】まとめスライド

      - 重要ポイントを箇条書きで整理
      - チェックマークやアイコンを添える
      - 視覚的に区切りを入れる

      【デザイン方針】
      - シンプルに要点のみ
      - 記憶に残りやすいデザイン
      - 達成感を感じられる雰囲気

  # ---------------------------------------------------------------------------
  # エンディングスライド
  # ---------------------------------------------------------------------------
  ending:
    name: "エンディングスライド"
    description: "動画やセクションの終了を示すスライド"
    keywords:
      - "終わり"
      - "エンディング"
      - "次へ"
      - "次回"
      - "続き"
      - "おしまい"
    prompt_template: |
      【レイアウト】エンディングスライド

      - 「お疲れ様でした」「次のレッスンへ」などのメッセージ
      - シンプルで達成感のあるデザイン
      - 次のアクションを促す要素

      【デザイン方針】
      - ポジティブで前向きな印象
      - 次へ進む意欲を促進
      - 押し付けがましくない

# =============================================================================
# デフォルトテンプレート
# =============================================================================
default_template: "content"

# =============================================================================
# ベースプロンプト（全スライド共通で先頭に付加）
# =============================================================================
base_prompt: |
  あなたはプログラミング教育動画用のスライド画像を生成するAIです。
  以下のガイドラインに従って、教育効果の高いスライド画像を生成してください。

  【全体的なデザイン原則】
  1. シンプルさ: 必要な情報のみを含め、視覚的なノイズを排除
  2. 一貫性: 色、フォント、レイアウトの統一感を維持
  3. 階層性: 情報の重要度に応じた視覚的な優先順位
  4. 可読性: 動画視聴時にも読みやすいフォントサイズと配色

  【技術的な制約】
  - 出力サイズ: 16:9 アスペクト比
  - 解像度: フルHD（1920x1080）を想定した高品質
  - 余白: 画面端から十分な余白を確保（セーフエリア内に重要情報）
