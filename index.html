<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">My Name</div>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#works">Works</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about" class="hero">
            <h1>Hello, I'm [Your Name]</h1>
            <p>ここにあなたの肩書きや、簡単な自己紹介を書いてください。シンプルが一番です。</p>
        </section>

        <section id="works">
            <h2>Works</h2>
            <div class="grid">
                <div class="card">
                    <div class="placeholder">Project 1</div>
                    <h3>作品タイトル 1</h3>
                    <p>作品の短い説明をここに書きます。</p>
                </div>
                <div class="card">
                    <div class="placeholder">Project 2</div>
                    <h3>作品タイトル 2</h3>
                    <p>制作期間や使用ツールなど。</p>
                </div>
                <div class="card">
                    <div class="placeholder">Project 3</div>
                    <h3>作品タイトル 3</h3>
                    <p>こだわったポイントなど。</p>
                </div>
            </div>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>お仕事の依頼はこちらまで</p>
            <a href="mailto:example@gmail.com" class="btn">Email Me</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
