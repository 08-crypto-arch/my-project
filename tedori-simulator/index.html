// ── 手取りシミュレーター（正社員 vs フリーランス）─────────────────
// 前提：単身・広島市・2025年改正後の控除。数字は概算です。
// 国保料率や協会けんぽ料率、調整控除などは簡略化しています。

// 給与所得控除（2025年〜、最低65万）
function kyuyoDeduction(s) {
  if (s <= 1_625_000) return Math.min(s, 650_000);
  if (s <= 1_800_000) return s * 0.4 - 100_000;
  if (s <= 3_600_000) return s * 0.3 + 80_000;
  if (s <= 6_600_000) return s * 0.2 + 440_000;
  if (s <= 8_500_000) return s * 0.1 + 1_100_000;
  return 1_950_000;
}

// 基礎控除・所得税（令和7・8年特例、合計所得金額ベース）
function kisoIncomeTax(g) {
  if (g <= 1_320_000) return 950_000;
  if (g <= 3_360_000) return 880_000;
  if (g <= 4_890_000) return 680_000;
  if (g <= 6_550_000) return 630_000;
  if (g <= 23_500_000) return 580_000;
  return 0;
}
const KISO_JUMIN = 430_000; // 住民税の基礎控除（据え置き）

// 所得税 速算表（税額控除前・復興税前）
function incomeTaxBase(taxable) {
  const t = Math.max(0, taxable);
  let tax;
  if (t <= 1_950_000) tax = t * 0.05;
  else if (t <= 3_300_000) tax = t * 0.1 - 97_500;
  else if (t <= 6_950_000) tax = t * 0.2 - 427_500;
  else if (t <= 9_000_000) tax = t * 0.23 - 636_000;
  else if (t <= 18_000_000) tax = t * 0.33 - 1_536_000;
  else if (t <= 40_000_000) tax = t * 0.4 - 2_796_000;
  else tax = t * 0.45 - 4_796_000;
  return Math.max(0, tax);
}

// 住宅ローン控除を所得税→住民税の順に適用
function applyLoanCredit(incomeTaxBaseAmt, shotokuwari, loanCredit) {
  const appliedIncome = Math.min(loanCredit, incomeTaxBaseAmt);
  const residualIncome = incomeTaxBaseAmt - appliedIncome;
  const incomeTaxFinal = residualIncome * 1.021; // 復興特別所得税
  const leftover = loanCredit - appliedIncome;
  const juminCredit = Math.min(leftover, 97_500); // 住民税からの控除上限
  const shotokuwariAfter = Math.max(0, shotokuwari - juminCredit);
  return { incomeTaxFinal, shotokuwariAfter };
}

// ── 正社員 ─────────────────────────────
function employeeCalc(gross, opts) {
  const { age40, loanCredit, kenpoRate } = opts;
  const kenpoHonnin = kenpoRate / 100 / 2; // 健保本人（協会けんぽ広島 令和7年度の折半）
  const kaigoHonnin = age40 ? 0.0159 / 2 : 0; // 介護本人（全国一律1.59%の折半）
  const kousei = Math.min(gross, 7_800_000) * 0.0915; // 厚生年金本人（上限あり）
  const koyou = gross * 0.006; // 雇用保険本人（一般事業）
  const social = gross * (kenpoHonnin + kaigoHonnin) + kousei + koyou;
  const kyuyoShotoku = gross - kyuyoDeduction(gross);

  const taxableIncome = Math.max(0, kyuyoShotoku - social - kisoIncomeTax(kyuyoShotoku));
  const itBase = incomeTaxBase(taxableIncome);

  const juminTaxable = Math.max(0, kyuyoShotoku - social - KISO_JUMIN);
  let shotokuwari = Math.max(0, juminTaxable * 0.1 - 2500); // 調整控除ざっくり
  const kintouwari = 6000;

  const { incomeTaxFinal, shotokuwariAfter } = applyLoanCredit(itBase, shotokuwari, loanCredit);
  const jumin = shotokuwariAfter + kintouwari;

  const net = gross - social - incomeTaxFinal - jumin;
  const socialItems = [
    { label: age40 ? "健康保険・介護" : "健康保険", value: gross * (kenpoHonnin + kaigoHonnin) },
    { label: "厚生年金", value: kousei },
    { label: "雇用保険", value: koyou },
  ];
  return { gross, social, socialItems, incomeTax: incomeTaxFinal, jumin, jigyozei: 0, keihi: 0, net };
}

// ── フリーランス ─────────────────────────
function freelanceCalc(uriage, keihi, opts) {
  const { age40, loanCredit, designTax, invoice } = opts;
  const jigyoShotoku = Math.max(0, uriage - keihi - 650_000); // 青色65万控除後
  const cash = uriage - keihi; // 生活に回せる元手

  // 国民年金（定額）
  const nenkin = 210_000;

  // 国民健康保険（広島市・概算）
  const kyuTadashigaki = Math.max(0, jigyoShotoku - 430_000);
  const shotokuRitsu = 0.079 + 0.025 + (age40 ? 0.024 : 0);
  const kintou = 19_000 + 7_000 + (age40 ? 9_000 : 0);
  const cap = 660_000 + 260_000 + (age40 ? 170_000 : 0);
  const kokuho = Math.min(kyuTadashigaki * shotokuRitsu + kintou, cap);

  const social = nenkin + kokuho;

  const taxableIncome = Math.max(0, jigyoShotoku - social - kisoIncomeTax(jigyoShotoku));
  const itBase = incomeTaxBase(taxableIncome);

  const juminTaxable = Math.max(0, jigyoShotoku - social - KISO_JUMIN);
  let shotokuwari = Math.max(0, juminTaxable * 0.1 - 2500);
  const kintouwari = 6000;

  const { incomeTaxFinal, shotokuwariAfter } = applyLoanCredit(itBase, shotokuwari, loanCredit);
  const jumin = shotokuwariAfter + kintouwari;

  // 個人事業税（青色控除は足し戻し、事業主控除290万）
  const jigyozeiBase = Math.max(0, uriage - keihi - 2_900_000);
  const jigyozei = designTax ? jigyozeiBase * 0.05 : 0;

  // 消費税（インボイス=課税事業者）：売上を税込とみなし、簡易課税・第5種（みなし仕入率50%）
  const shohizei = invoice ? (uriage * 10) / 110 * 0.5 : 0;

  const net = cash - social - incomeTaxFinal - jumin - jigyozei - shohizei;
  const socialItems = [
    { label: "国民年金", value: nenkin },
    { label: "国民健康保険", value: kokuho },
  ];
  return { gross: uriage, social, socialItems, incomeTax: incomeTaxFinal, jumin, jigyozei, shohizei, keihi, net };
}

// 逆算：正社員手取りに並ぶフリー売上（現在の経費前提）
function solveUriage(targetNet, keihi, opts) {
  let lo = keihi,
    hi = keihi + 30_000_000;
  for (let i = 0; i < 70; i++) {
    const mid = (lo + hi) / 2;
    if (freelanceCalc(mid, keihi, opts).net < targetNet) lo = mid;
    else hi = mid;
  }
  return (lo + hi) / 2;
}

const yen = (n) => "¥" + Math.round(n).toLocaleString("ja-JP");
const man = (n) => (Math.round(n / 1000) / 10).toLocaleString("ja-JP", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

function Control({ label, sub, value, setValue, min, max, step, unit }) {
  return (
    <div className="ctrl">
      <div className="ctrl-head">
        <label>{label}{sub && <span className="ctrl-sub">{sub}</span>}</label>
        <div className="ctrl-val">
          <input
            type="number"
            value={Math.round(value / 10000)}
            min={min / 10000}
            max={max / 10000}
            step={step / 10000}
            onChange={(e) => {
              const v = Number(e.target.value) * 10000;
              if (!Number.isNaN(v)) setValue(Math.max(min, Math.min(max, v)));
            }}
          />
          <span className="unit">{unit}</span>
        </div>
      </div>
      <input
        type="range"
        min={min}
        max={max}
        step={step}
        value={value}
        onChange={(e) => setValue(Number(e.target.value))}
      />
    </div>
  );
}

function StackBar({ segments, scaleMax, pathColor }) {
  return (
    <div className="stack">
      {segments.map((s, i) => {
        const w = (s.value / scaleMax) * 100;
        if (w <= 0) return null;
        return (
          <div
            key={i}
            className={"seg " + s.kind}
            style={{ width: w + "%", background: s.kind === "net" ? pathColor : undefined }}
            title={`${s.label}：${yen(s.value)}`}
          />
        );
      })}
    </div>
  );
}

function PathCard({ title, color, data, scaleMax, showKeihi, winner }) {
  const tax = data.incomeTax + data.jumin + data.jigyozei + (data.shohizei || 0);
  const segments = [
    { kind: "net", label: "手取り", value: data.net },
    { kind: "tax", label: "税金", value: tax },
    { kind: "social", label: "社会保険", value: data.social },
  ];
  if (showKeihi) segments.push({ kind: "keihi", label: "経費", value: data.keihi });

  return (
    <div className={"card" + (winner ? " winner" : "")} style={{ "--path": color }}>
      <div className="card-top">
        <span className="tag" style={{ background: color }}>{title}</span>
        {winner && <span className="crown">手取り多い</span>}
      </div>
      <div className="net">
        <span className="net-num">{man(data.net)}</span>
        <span className="net-man">万円 / 年</span>
      </div>
      <div className="net-month">1ヶ月あたりの手取り額 {yen(data.net / 12)}</div>
      <StackBar segments={segments} scaleMax={scaleMax} pathColor={color} />
      <ul className="rows">
        <li><span>社会保険</span><b>{yen(data.social)}</b></li>
        {data.socialItems.map((s, i) => (
          <li className="sub" key={i}><span>{s.label}</span><b>{yen(s.value)}</b></li>
        ))}
        <li><span>所得税</span><b>{yen(data.incomeTax)}</b></li>
        <li><span>住民税</span><b>{yen(data.jumin)}</b></li>
        {data.jigyozei > 0 && <li><span>個人事業税</span><b>{yen(data.jigyozei)}</b></li>}
        {data.shohizei > 0 && <li><span>消費税</span><b>{yen(data.shohizei)}</b></li>}
        {showKeihi && <li className="dim"><span>経費（生活費外）</span><b>{yen(data.keihi)}</b></li>}
      </ul>
    </div>
  );
}

function App() {
  const [salary, setSalary] = useState(4_000_000);
  const [uriage, setUriage] = useState(4_000_000);
  const [keihi, setKeihi] = useState(800_000);
  const [age40, setAge40] = useState(false);
  const [designTax, setDesignTax] = useState(true);
  const [invoice, setInvoice] = useState(false);
  const [loanCredit, setLoanCredit] = useState(0);
  const [showAssume, setShowAssume] = useState(false);

  const kenpoRate = 9.97; // 協会けんぽ広島 令和7年度
  const opts = { age40, loanCredit, designTax, kenpoRate, invoice };

  const emp = useMemo(() => employeeCalc(salary, opts), [salary, age40, loanCredit]);
  const free = useMemo(() => freelanceCalc(uriage, keihi, opts), [uriage, keihi, age40, loanCredit, designTax, invoice]);
  const breakeven = useMemo(() => solveUriage(emp.net, keihi, opts), [emp.net, keihi, age40, loanCredit, designTax, invoice]);

  const scaleMax = Math.max(salary, uriage);
  const diff = free.net - emp.net;

  return (
    <div className="app">
      <style>{css}</style>

      <header className="hero">
        <div className="hero-visual">
          <img src={HERO_IMG} alt="オフィスで働く正社員と、自宅で働くフリーランス" />
        </div>
        <div className="eyebrow">手取りシミュレーター</div>
        <h1>正社員と<span className="ink-e">フリーランス</span>、<br />手元に残るのはどっち？</h1>
        <p className="lead">
          税金・社会保険・経費・住宅ローン控除まで動かして、生活に使える手取りを並べて比べます。
        </p>
      </header>

      <section className="panel">
        <Control label="正社員の額面" sub="年収" value={salary} setValue={setSalary} min={2_000_000} max={10_000_000} step={100_000} unit="万円" />
        <Control label="フリーランスの売上" sub="年商" value={uriage} setValue={setUriage} min={2_000_000} max={10_000_000} step={100_000} unit="万円" />
        <Control label="フリーランスの経費" sub="年間" value={keihi} setValue={setKeihi} min={0} max={4_000_000} step={50_000} unit="万円" />
        <Control label="住宅ローン控除" sub="年間・任意" value={loanCredit} setValue={setLoanCredit} min={0} max={350_000} step={5_000} unit="万円" />

        <div className="toggles">
          <button className={"toggle" + (age40 ? " on" : "")} onClick={() => setAge40(!age40)}>
            40歳以上（介護保険）
          </button>
          <button className={"toggle" + (designTax ? " on" : "")} onClick={() => setDesignTax(!designTax)}>
            個人事業税（5％）
          </button>
          <button className={"toggle" + (invoice ? " on" : "")} onClick={() => setInvoice(!invoice)}>
            インボイス（消費税）
          </button>
        </div>
      </section>

      <section className="results">
        <PathCard title="正社員" color="#2E6E63" data={emp} scaleMax={scaleMax} showKeihi={false} winner={emp.net >= free.net} />
        <PathCard title="フリーランス" color="#C1873B" data={free} scaleMax={scaleMax} showKeihi={true} winner={free.net > emp.net} />
      </section>

      <section className="diff">
        {Math.abs(diff) < 30000 ? (
          <p>手取りはほぼ互角（差 {yen(Math.abs(diff))}）。売上と経費のバランスがちょうど拮抗しています。</p>
        ) : diff > 0 ? (
          <p>いまの条件だと<b className="ink-f">フリーランスが年 {yen(diff)}（月 {yen(diff / 12)}）多い</b>手取りです。</p>
        ) : (
          <p>いまの条件だと<b className="ink-e">正社員が年 {yen(-diff)}（月 {yen(-diff / 12)}）多い</b>手取りです。</p>
        )}
      </section>

      <section className="breakeven">
        <div className="be-content">
          <div className="be-label">正社員と手取りを並べるライン</div>
          <div className="be-num">
            売上 <strong>{man(breakeven)}</strong> 万円
          </div>
          <p className="be-sub">
            ※経費 {man(keihi)}万円のとき、フリーランスでこの売上を出せば正社員 {man(salary)}万円（手取り {man(emp.net)}万円）に並びます。
            <br />
            ※ 経費を増やすほど、必要な売上も上がります。
          </p>
        </div>
        <img className="be-img" src={FLOW_IMG} alt="売上から経費・税金と社会保険料を差し引くと手取りになる、という計算の流れを示す図" />
      </section>

      <button className="assume-btn" onClick={() => setShowAssume(!showAssume)}>
        {showAssume ? "− " : "＋ "}前提と注意点
      </button>
      {showAssume && (
        <div className="assume">
          <ul>
            <li>単身・広島市・2025年改正後の控除で計算した<b>概算</b>です。実額は税務署・税理士にご確認ください。</li>
            <li>両者とも<b>基礎控除・社会保険料控除は反映済み</b>。正社員は給与所得控除、フリーランスは青色申告65万控除で「みなし経費／実経費」を差し引いています。</li>
            <li>フリーランスの経費は「生活費外の事業支出」として手取りから除いています。</li>
            <li>国保料率・協会けんぽ料率（広島）・調整控除・森林環境税などは簡略化。個人事業税はデザイン業（第3種5%・事業主控除290万）想定。</li>
            <li>「インボイス（消費税）」をオンにすると課税事業者として消費税を差し引きます。売上を税込とみなし、簡易課税・第5種（サービス業、みなし仕入率50%）で概算（＝売上税額の50%）。2割特例（令和8年分まで）や3割特例（令和9・10年）を使うと納税額はさらに少なくなります。</li>
            <li><b>正社員の年収は、賞与を含めた総支給額を12等分し、月給と同じ税率・保険料率で概算しています。</b>実際は賞与にだけ社会保険料の上限額（健康保険は年573万円、厚生年金は1回150万円）が別に定められているため、賞与の割合が高い会社ほど、本来の手取りはこの概算より多くなることがあります。退職金や厚生年金の将来受給も含めていません。</li>
            <li>住宅ローン控除は所得税→住民税（上限9.75万）の順に適用。控除枠が税額を超える分は「使い切れず消える」ため、手取りには反映されません。</li>
          </ul>
        </div>
      )}

      <footer className="disclaimer">
        概算であり、実際の税額を保証するものではありません。正確な計算は税務署・税理士へ。
      </footer>
    </div>
  );
}

const css = `
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');
* { box-sizing: border-box; }
.app {
  --ink:#23303A; --muted:#6B7772; --paper:#EFF2EE; --card:#FFFFFF;
  --line:#DCE3DE; --e:#2E6E63; --f:#C1873B; --ink-soft:#616F7A;
  font-family:'Lora', 'Zen Maru Gothic', system-ui, sans-serif;
  color:var(--ink); background:var(--paper);
  max-width:860px; margin:0 auto; padding:28px 20px 48px;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.app h1 { font-family:'Zen Maru Gothic', sans-serif; font-weight:900; }
.app .net-num, .app .be-num strong { font-family:'Lora', serif; font-weight:700; }

.hero-visual { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:20px; }
.hero-visual img { display:block; width:100%; height:auto; }
.hero { margin-bottom:26px; }
.eyebrow { font-size:12px; letter-spacing:.18em; color:var(--e); font-weight:700; margin-bottom:10px; }
.hero h1 { font-size:30px; line-height:1.32; font-weight:700; margin:0 0 12px; letter-spacing:.01em; }
.ink-e { color:var(--e); } .ink-f { color:var(--f); }
.lead { color:var(--muted); font-size:14px; margin:0; max-width:44ch; }

.panel {
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:20px 22px; margin-bottom:22px;
  box-shadow:0 1px 0 rgba(35,48,58,.02);
}
.ctrl { padding:12px 0; border-bottom:1px dashed var(--line); }
.ctrl:first-child { padding-top:2px; }
.ctrl-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.ctrl-head label { font-size:14px; font-weight:500; }
.ctrl-sub { font-size:11px; color:var(--muted); margin-left:7px; font-weight:400; }
.ctrl-val { display:flex; align-items:baseline; gap:4px; }
.ctrl-val input {
  width:70px; text-align:right; font-size:19px; font-weight:700; color:var(--ink);
  border:none; border-bottom:2px solid var(--line); background:transparent;
  font-family:'Lora', serif; padding:1px 2px;
}
.ctrl-val input:focus { outline:none; border-color:var(--e); }
.unit { font-size:12px; color:var(--muted); }
.ctrl input[type=range] { width:100%; accent-color:var(--e); height:4px; margin-top:2px; }

.toggles { display:flex; gap:10px; flex-wrap:wrap; padding-top:14px; }
.toggle {
  font-family:inherit; font-size:12.5px; padding:7px 14px; border-radius:999px;
  border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer;
  transition:all .15s;
}
.toggle.on { background:var(--ink); color:#fff; border-color:var(--ink); }

.results { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.card {
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 8px;
  position:relative; transition:box-shadow .2s, transform .2s;
}
.card.winner { box-shadow:0 6px 24px -12px color-mix(in srgb, var(--path) 55%, transparent); border-color:color-mix(in srgb, var(--path) 45%, var(--line)); }
.card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; min-height:24px; }
.tag { color:#fff; font-size:12px; font-weight:700; padding:4px 11px; border-radius:7px; letter-spacing:.04em; }
.crown { font-size:11px; font-weight:700; color:var(--path); }
.net { display:flex; align-items:baseline; gap:6px; margin-top:6px; }
.net-num { font-size:40px; font-weight:700; line-height:1; letter-spacing:.01em; }
.net-man { font-size:13px; color:var(--muted); }
.net-month { font-size:12.5px; color:var(--muted); margin:4px 0 14px; }

.stack { display:flex; height:12px; border-radius:6px; overflow:hidden; background:#EDEFEC; margin-bottom:14px; }
.seg { height:100%; }
.seg.tax { background:#9AA6A0; }
.seg.social { background:#C4CCC7; }
.seg.keihi { background:repeating-linear-gradient(45deg,#E4E1D7,#E4E1D7 4px,#EDEBE2 4px,#EDEBE2 8px); }

.rows { list-style:none; margin:0; padding:0; }
.rows li { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid #F0F2EF; }
.rows li span { color:var(--muted); }
.rows li b { font-variant-numeric:tabular-nums; font-weight:500; }
.rows li.dim b, .rows li.dim span { color:#A6AEA9; }
.rows li.sub { padding:3px 0 3px 12px; border-top:none; font-size:11.5px; }
.rows li.sub span { color:#9AA6A0; }
.rows li.sub span::before { content:"– "; color:#C4CCC7; }
.rows li.sub b { color:#8B958F; font-weight:400; }

.diff { text-align:center; font-size:15px; padding:6px 0 20px; }
.diff b { font-size:16px; }

.breakeven {
  background:var(--ink-soft); color:#fff; border-radius:16px; padding:22px 24px;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:20px 28px;
}
.be-content { flex:1 1 260px; text-align:center; }
.be-label { font-size:12px; letter-spacing:.1em; color:#fff; font-weight:700; margin-bottom:8px; }
.be-num { font-size:20px; font-weight:500; }
.be-num strong { font-size:34px; color:#8FD0BF; margin:0 4px; }
.be-sub { font-size:12.5px; color:#C2CDC7; margin:12px auto 0; max-width:46ch; line-height:1.7; }
.be-img { width:360px; max-width:100%; flex-shrink:0; border-radius:12px; }

.assume-btn {
  margin:20px auto 0; display:block; background:none; border:none; color:var(--muted);
  font-family:inherit; font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;
}
.assume { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin-top:10px; }
.assume ul { margin:0; padding-left:18px; }
.assume li { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.65; }
.assume li:last-child { margin-bottom:0; }
.assume b { color:var(--ink); }

.disclaimer {
  margin-top:28px; padding-top:16px; border-top:1px solid var(--line);
  font-size:11.5px; color:var(--muted); text-align:center; line-height:1.7;
}

@media (max-width:620px) {
  .hero h1 { font-size:25px; }
  .results { grid-template-columns:1fr; }
  .net-num { font-size:36px; }
}
`;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
